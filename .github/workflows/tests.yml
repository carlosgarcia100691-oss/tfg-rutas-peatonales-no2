name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "numpy>=1.24,<2.0" "pandas>=2.0" "scipy>=1.10" "scikit-learn>=1.3" "networkx>=3.0" "osmnx>=1.9" "pytest>=7.4"

      - name: Run tests
        run: python -m pytest tests/ -v
